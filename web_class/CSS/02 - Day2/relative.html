<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relative</title>
    <style>
        .common{
            height: 100px;
            background-color: red;
        }
        .first{
            background-color: rgb(134, 41, 57);
            color: white;
            top: 200px;
        }
        .second{
            background-color: rgb(26, 21, 126);
            color: white;
            position: relative;
            top: 20px;
            left: 10px;

        }
        .third{
            /* background-color: rgb(12, 163, 20); */
            color: white;
        }
        #y_x{
            background-color: blueviolet;
        }
    </style>
</head>
<body>
    <section class="common">Section-1</section>
    <section class="common">Section-2</section>
    <section class="common" id="y_x">Section-3</section>
</body>
</html>
